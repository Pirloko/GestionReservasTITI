[build]
  publish = "mockup"
  command = "node scripts/write-landing-config.js && node scripts/write-supabase-config.js"

[[redirects]]
  from = "/acceso"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/acceso/"
  to = "/app.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
